<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expo Innovación · Inversión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--panel:#111a2e;--line:#243250;--text:#e8eef9;--mute:#8a99b8;--cy:#3ddcff;--cy2:#1b8fb0;--warn:#ffb547;--ok:#5ff0b0}
*{box-sizing:border-box;margin:0;touch-action:manipulation}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#15305a55,transparent),var(--bg);color:var(--text);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;-webkit-user-select:none;user-select:none}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 120px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.95rem}
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:8px 0 16px}
.hud-in{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:center}
.hud .lbl{color:var(--mute);font-size:.9rem}
.big{font-size:2.6rem;font-weight:800;color:var(--cy);font-variant-numeric:tabular-nums;line-height:1.1}
.big.done{color:var(--ok)}
.segs{display:flex;gap:4px;grid-row:1/3;grid-column:2}
.seg{flex:1;height:14px;border-radius:3px;background:var(--line);transition:background .2s}
.seg.on{background:var(--cy)}
.hud.done .seg.on{background:var(--ok)}
.rule{grid-column:1/3;color:var(--mute);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.max{border-color:var(--warn)}
.name{font-weight:600;font-size:1.05rem;margin-bottom:10px}
.amt{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:10px}
.mini{display:flex;gap:3px;margin-bottom:14px}
.mini .seg{height:8px}
.card.max .mini .seg.on{background:var(--warn)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:var(--text)}
.step{height:56px;font-size:1.8rem;font-weight:600;background:#1a2745;border:1px solid var(--line)}
.step:active:not(:disabled){background:var(--cy2)}
.step:disabled{opacity:.3;cursor:not-allowed}
.note{margin-top:8px;font-size:.8rem;color:var(--warn);min-height:1.1em}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0a1020ee;border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;align-items:center}
.bar .msg{color:var(--mute);font-size:.95rem;flex:1;max-width:560px}
.btn{height:56px;padding:0 28px;font-weight:600;font-size:1.05rem;background:var(--cy);color:#04141c}
.btn:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.bar.ready{background:#0c2a22f5;border-top:2px solid var(--ok);box-shadow:0 -10px 40px #5ff0b033}
.bar.ready .msg{color:var(--ok);font-weight:600;font-size:1.15rem}
.btn.go{height:64px;min-width:280px;font-size:1.2rem;font-weight:800}
.btn.go:not(:disabled){background:var(--ok);color:#04201a;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #5ff0b0aa}70%{box-shadow:0 0 0 22px #5ff0b000}100%{box-shadow:0 0 0 0 #5ff0b000}}
@media(prefers-reduced-motion:reduce){.btn.go{animation:none!important}}
.pend{position:fixed;right:12px;top:8px;font-size:.75rem;color:var(--warn)}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.check{width:84px;height:84px;border-radius:50%;border:3px solid var(--ok);display:grid;place-items:center;font-size:2.6rem;color:var(--ok)}
.hide{display:none!important}
.res{display:grid;gap:12px;margin-top:10px}
.rrow{display:grid;grid-template-columns:300px 1fr 170px;gap:14px;align-items:center;font-size:1.05rem}
.track{background:var(--line);height:26px;border-radius:6px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--cy2),var(--cy));border-radius:6px;transition:width .6s}
.rrow:first-child .fill{background:linear-gradient(90deg,#d99320,var(--warn))}
.rv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
input{font:inherit;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;text-align:center;width:200px;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
@media(max-width:720px){.hud-in{grid-template-columns:1fr}.segs{grid-column:1;grid-row:auto}.rule{grid-column:1}.rrow{grid-template-columns:1fr}.rv{text-align:left}.bar .msg{display:none}.bar .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="form" class="wrap">
  <header>
    <div><h1 id="titulo"></h1><p class="sub">Reparte tu capital entre los proyectos que más te convenzan.</p></div>
    <button class="btn ghost" id="reset" style="height:44px;padding:0 18px;font-size:.9rem">Reiniciar</button>
  </header>
  <section class="hud" id="hud"><div class="hud-in">
    <div><div class="lbl">Te falta repartir</div><div class="big" id="left"></div></div>
    <div class="segs" id="segs"></div>
    <div class="rule" id="rule"></div>
  </div></section>
  <section class="grid" id="grid"></section>
</main>

<div class="bar" id="bar">
  <div class="msg" id="msg"></div>
  <button class="btn go" id="review" disabled>Enviar mi inversión</button>
</div>

<main id="thanks" class="wrap hide"><div class="center">
  <div class="check">✓</div>
  <h1>Inversión registrada</h1>
  <p class="sub">Gracias por participar. Pasa el turno al siguiente inversionista.</p>
  <button class="btn" id="next">Nuevo inversionista (<span id="cd">8</span>)</button>
</div></main>

<main id="results" class="wrap hide" style="padding-bottom:40px">
  <div id="pinbox" class="center">
    <h1>Resultados</h1><p class="sub">Ingresa el PIN para continuar.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
    <button class="btn" id="pinok">Entrar</button><p class="note" id="pinerr"></p>
  </div>
  <div id="resbox" class="hide">
    <header><div><h1>Resultados de inversión</h1><p class="sub" id="resinfo"></p></div><button class="btn ghost" id="refresh" style="height:44px;padding:0 18px;font-size:.9rem">Actualizar</button></header>
    <div class="res" id="res"></div>
  </div>
</main>

<div class="pend hide" id="pend"></div>

<script>
const C={
  TITULO:"Expo Innovación",
  CAPITAL:100000,          // capital de cada inversionista
  PASO:5000,               // cada clic suma o resta este monto
  MINIMO:0,                // sin mínimo por proyecto
  MAX_PCT:0.5,             // máximo por proyecto (50%)
  GRUPOS:["Clasificación de Productos Inteligente","Supermercado Automatizado","Edificio Domótico Inteligente","Estacionamiento Inteligente","Invernadero Automatizado","Almacén Automatizado con Brazo Robótico","Sistema Inteligente de Semáforos y Control de Tráfico"],
  SCRIPT_URL:"https://script.google.com/macros/s/AKfycbx2C0vj58I2Y3zy4ahzLv5Ww7g_wPYGrHzQtFf578neGozKHFnQIMh32GKEizcA4Zsx/exec",
  PIN:"1234"               // PIN para ver resultados (#resultados)
};
const MAX=C.CAPITAL*C.MAX_PCT, $=s=>document.querySelector(s);
const fmt=n=>"Q"+Number(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const segs=(on,total)=>Array.from({length:total},(_,i)=>`<i class="seg${i<on?" on":""}"></i>`).join("");
let m, cdT;
const left=()=>C.CAPITAL-m.reduce((a,b)=>a+b,0);
const reset=()=>{m=C.GRUPOS.map(()=>C.MINIMO);draw()};

function draw(){
  const l=left(), done=l===0;
  $("#titulo").textContent=C.TITULO;
  $("#left").textContent=fmt(l); $("#left").classList.toggle("done",done);
  $("#hud").classList.toggle("done",done);
  $("#segs").innerHTML=segs(l/C.PASO,C.CAPITAL/C.PASO);
  $("#rule").textContent=`Máximo por proyecto: ${fmt(MAX)}. Cada toque suma o resta ${fmt(C.PASO)}.`;
  $("#grid").innerHTML=C.GRUPOS.map((g,i)=>{
    const atMax=m[i]>=MAX;
    return `<article class="card${atMax?" max":""}"><div class="name">${esc(g)}</div><div class="amt">${fmt(m[i])}</div>
    <div class="mini">${segs(m[i]/C.PASO,MAX/C.PASO)}</div>
    <div class="ctl"><button class="step" data-i="${i}" data-d="-1" aria-label="Quitar a ${esc(g)}" ${m[i]-C.PASO<C.MINIMO?"disabled":""}>−</button>
    <button class="step" data-i="${i}" data-d="1" aria-label="Sumar a ${esc(g)}" ${atMax||l<C.PASO?"disabled":""}>+</button></div>
    <div class="note">${atMax?"Llegó al máximo permitido":""}</div></article>`}).join("");
  $("#review").disabled=!done; $("#bar").classList.toggle("ready",done);
  $("#msg").textContent=done?"¡Todo repartido! Toca el botón verde para enviar tu inversión.":`Faltan ${fmt(l)} por repartir para poder enviar.`;
}

$("#grid").addEventListener("click",e=>{
  const b=e.target.closest(".step"); if(!b||b.disabled) return;
  const i=+b.dataset.i, d=+b.dataset.d, n=m[i]+d*C.PASO;
  if(n<C.MINIMO||n>MAX||(d>0&&left()<C.PASO)) return;
  m[i]=n; draw();
});
$("#reset").onclick=reset;

/* Envío con cola local: si falla la red, se reintenta solo */
const load=()=>{try{return JSON.parse(localStorage.getItem("cola")||"[]")}catch(e){return[]}};
const save=q=>{try{localStorage.setItem("cola",JSON.stringify(q))}catch(e){}};
async function flush(){
  const q=load(), rest=[];
  const ok=C.SCRIPT_URL.startsWith("https://");
  for(const r of q){
    if(!ok){rest.push(r);continue}
    try{await fetch(C.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(r)})}
    catch(e){rest.push(r)}
  }
  save(rest);
  $("#pend").classList.toggle("hide",!rest.length);
  $("#pend").textContent=`Pendientes de enviar: ${rest.length}`;
}
$("#review").onclick=()=>{
  if(left()!==0) return;
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const q=load(); q.push({id,montos:m.slice()}); save(q);
  show("thanks"); flush(); countdown();
};
function countdown(){
  let s=8; $("#cd").textContent=s; clearInterval(cdT);
  cdT=setInterval(()=>{s--;$("#cd").textContent=s;if(s<=0)next()},1000);
}
function next(){clearInterval(cdT);reset();show("form")}
$("#next").onclick=next;
setInterval(flush,30000);

/* Vistas */
function show(v){
  $("#form").classList.toggle("hide",v!=="form");
  $("#bar").classList.toggle("hide",v!=="form");
  $("#thanks").classList.toggle("hide",v!=="thanks");
  $("#results").classList.toggle("hide",v!=="results");
}
function route(){location.hash==="#resultados"?(show("results"),clearInterval(cdT)):show("form")}
addEventListener("hashchange",route);

/* Resultados */
let rT;
async function loadRes(){
  try{
    const r=await fetch(C.SCRIPT_URL+"?t="+Date.now()); const d=await r.json();
    const g=d.grupos.slice().sort((a,b)=>b.total-a.total), top=Math.max(1,...g.map(x=>x.total)), all=g.reduce((a,x)=>a+x.total,0)||1;
    $("#resinfo").textContent=`${d.inversionistas} inversionistas · ${fmt(all)} invertidos en total`;
    $("#res").innerHTML=g.map(x=>`<div class="rrow"><div>${esc(x.nombre)}</div><div class="track"><div class="fill" style="width:${x.total/top*100}%"></div></div><div class="rv">${fmt(x.total)} · ${Math.round(x.total/all*100)}%</div></div>`).join("");
  }catch(e){$("#resinfo").textContent="No se pudieron cargar los datos. Revisa la URL del script."}
}
$("#pinok").onclick=()=>{
  if($("#pin").value===C.PIN){$("#pinbox").classList.add("hide");$("#resbox").classList.remove("hide");loadRes();clearInterval(rT);rT=setInterval(loadRes,15000)}
  else $("#pinerr").textContent="PIN incorrecto";
};
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("#pinok").click()});
$("#refresh").onclick=loadRes;

reset(); route(); flush();
</script>
</body>
</html>
